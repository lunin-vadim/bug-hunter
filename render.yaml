# Render Blueprint: бесплатный веб-сервис, база — внешняя (Prisma Postgres)
services:
  - type: web
    name: bug-hunter
    runtime: node
    # free: засыпает после 15 мин без запросов, просыпается ~минуту; 750 инстанс-часов в месяц на воркспейс
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # Render проверяет здоровье каждые несколько секунд: /livez не ходит в БД и не тратит квоту операций Prisma
    healthCheckPath: /livez
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # строка подключения Prisma Postgres (пул: pooled.db.prisma.io); вводится в панели Render, в репозиторий не попадает
      - key: DATABASE_URL
        sync: false
      # соединений с БД; у Prisma Postgres Free всего 10 пул-соединений
      - key: PG_POOL_MAX
        value: '5'
